<title>Fatura Okuyucu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: header with language and theme switches, a drop area, file chips, then one invoice sheet
   (seller left, document box right, buyer, item table, notes left, totals right).
   Dark theme is pure black (#000) so OLED pixels stay off. */
:root {
  --bg: #E8EDF0;
  --paper: #FFFFFF;
  --ink: #15222B;
  --muted: #587080;
  --line: #D2DBE1;
  --soft: #F2F5F7;
  --accent: #14607E;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEAF1;
  --err: #A32629;
  --err-bg: #FBE8E8;
  --font-display: 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, system-ui, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --paper: #000000; --ink: #ECECEC; --muted: #8E9AA2; --line: #262B2F;
    --soft: #0B0D0E; --accent: #6DB8D6; --accent-ink: #000000; --accent-soft: #0A1A22;
    --err: #F29295; --err-bg: #1F0A0B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --paper: #000000; --ink: #ECECEC; --muted: #8E9AA2; --line: #262B2F;
  --soft: #0B0D0E; --accent: #6DB8D6; --accent-ink: #000000; --accent-soft: #0A1A22;
  --err: #F29295; --err-bg: #1F0A0B; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; }
.mono { font-family: var(--font-mono); }
.cap { color: var(--muted); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

header.top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
.titles { min-width: 0; flex: 1 1 320px; }
h1 { font: 800 26px/1.1 var(--font-display); letter-spacing: -0.01em; margin: 0 0 4px; }
.controls { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button {
  all: unset; box-sizing: border-box; cursor: pointer; padding: 7px 12px; font: 600 12.5px/1 var(--font-body);
  letter-spacing: 0.04em; color: var(--muted);
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn {
  all: unset; box-sizing: border-box; cursor: pointer; width: 34px; height: 32px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 6px; color: var(--ink);
}
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 17px; height: 17px; }

.drop {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px;
  border: 1.5px dashed var(--line); border-radius: 6px; background: var(--soft); padding: 14px 16px;
  transition: border-color .15s, background-color .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 320px; }
.btn {
  display: inline-block; font: 500 14px/1.2 var(--font-body); padding: 9px 16px; border-radius: 5px;
  border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.1); }
.btn:focus-visible, label.btn:focus-within, .chip .sel:focus-visible, .chip .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.formats { margin: 8px 2px 0; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 13px;
}
.chip[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.chip.bad { border-color: var(--err); color: var(--err); }
.chip .sel { all: unset; cursor: pointer; min-width: 0; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip .x { all: unset; cursor: pointer; width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; color: var(--muted); }
.chip .x:hover { background: var(--line); }

.notice { margin-top: 12px; padding: 10px 14px; border-radius: 5px; font-size: 13.5px; overflow-wrap: anywhere; }
.notice.info { background: var(--accent-soft); }
.notice.err { background: var(--err-bg); color: var(--err); }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 10px; }

.sheet {
  background: var(--paper); border: 1px solid var(--line); border-radius: 4px;
  padding: clamp(16px, 4vw, 36px); margin-top: 10px;
}
.sheet:empty { display: none; }
.head { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; }
.eyebrow { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
.party h2 { font: 700 20px/1.25 var(--font-display); margin: 0 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
.party h3 { font: 700 16px/1.3 var(--font-display); margin: 0 0 4px; overflow-wrap: anywhere; }
.party > div { overflow-wrap: anywhere; }
.k { color: var(--muted); font-size: 12.5px; margin-right: 4px; }
.idline { font-size: 13.5px; }
.docbox { border: 1.5px solid var(--ink); padding: 14px 16px; min-width: 0; }
.docbox .fmt { display: inline-block; font: 500 11px/1 var(--font-mono); letter-spacing: 0.02em; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 3px 6px; margin-bottom: 10px; }
.docbox .label { font: 800 22px/1.1 var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; overflow-wrap: anywhere; }
.docbox .kind { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 12px; min-height: 1em; }
dl.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; }
dl.meta dt { color: var(--muted); font-size: 12.5px; }
dl.meta dd { margin: 0; font: 400 13px/1.4 var(--font-mono); text-align: right; overflow-wrap: anywhere; }
.buyer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }

.tablewrap { margin-top: 24px; overflow-x: auto; }
table.items { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.items th {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600;
  text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--ink); white-space: nowrap;
}
.items td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.items th.num, .items td.num { text-align: right; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.items .name { min-width: 200px; overflow-wrap: anywhere; }
.items .name strong { font-weight: 600; }
.items .cap { display: block; }
.empty-lines { margin-top: 24px; color: var(--muted); }

.foot { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 28px; margin-top: 24px; }
.foot-left { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.foot-left ul { margin: 0; padding-left: 18px; }
.foot-left li { overflow-wrap: anywhere; }
table.totals { width: 100%; border-collapse: collapse; font-size: 14px; }
.totals td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.totals td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
.totals tr.grand td { border-bottom: 0; border-top: 2px solid var(--ink); padding-top: 10px; font: 700 18px/1.3 var(--font-display); }
.totals tr.incl td { color: var(--muted); font-size: 13px; }
.words { margin-top: 20px; background: var(--soft); padding: 10px 14px; font-size: 13.5px; }
.fine {
  margin-top: 22px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px;
  display: flex; flex-wrap: wrap; gap: 4px 18px;
}
.fine span { overflow-wrap: anywhere; }

.toast {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
}
.toast span {
  background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 6px; font-size: 13.5px;
  opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s;
}
.toast.show span { opacity: 1; transform: none; }

@media (max-width: 700px) {
  .head, .foot { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .tablewrap { overflow-x: visible; }
  .items thead { display: none; }
  .items, .items tbody, .items tr, .items td { display: block; width: 100%; }
  .items tr { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .items td { border: 0; padding: 2px 0; display: flex; justify-content: space-between; gap: 12px; text-align: right; }
  .items td::before { content: attr(data-label); color: var(--muted); font-size: 12px; text-align: left; flex: none; }
  .items td.name { display: block; text-align: left; }
  .items td.name::before { display: none; }
  .items td.idx, .items td:empty { display: none; }
  .items td .v { text-align: right; }
  .num { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) {
  .drop, .toast span { transition: none; }
}
</style>

<main class="wrap">
  <header class="top">
    <div class="titles">
      <h1 data-i="title"></h1>
      <p class="cap" data-i="subtitle"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" id="langSeg">
        <button type="button" data-lang="tr" aria-pressed="false" lang="tr">TR</button>
        <button type="button" data-lang="en" aria-pressed="false" lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="themeBtn"></button>
    </div>
  </header>

  <section class="drop" id="drop">
    <div class="drop-text">
      <strong data-i="dropTitle"></strong>
      <span class="cap" data-i="dropHint"></span>
    </div>
    <label class="btn" id="pickLabel"><span data-i="pick"></span><input type="file" id="pick" class="sr" multiple accept=".xml,.json,.pdf,.zip,.p7m,text/xml,application/xml,application/json,application/pdf,application/zip"></label>
  </section>
  <p class="cap formats"><strong data-i="formats"></strong>: UBL 2.1 (UBL-TR, PEPPOL BIS, XRechnung, EN 16931) · UN/CEFACT CII (Factur-X, ZUGFeRD) · FatturaPA · CFDI · NF-e · India e-Invoice</p>

  <div class="chips" id="chips"></div>
  <div id="notices"></div>

  <div class="actions" id="actions" hidden>
    <button type="button" class="btn ghost" id="copySummary" data-i="copySummary"></button>
    <button type="button" class="btn ghost" id="copyLines" data-i="copyLines"></button>
  </div>

  <article class="sheet" id="sheet"></article>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"><span></span></div>

const TR1 = ['', 'bir', 'iki', 'üç', 'dört', 'beş', 'altı', 'yedi', 'sekiz', 'dokuz'];
const TR10 = ['', 'on', 'yirmi', 'otuz', 'kırk', 'elli', 'altmış', 'yetmiş', 'seksen', 'doksan'];
const TRS = ['', 'bin', 'milyon', 'milyar', 'trilyon'];
function trBelow(n) {
  const h = Math.floor(n / 100), tn = Math.floor((n % 100) / 10), o = n % 10;
  let s = '';
  if (h) s += (h > 1 ? TR1[h] + ' ' : '') + 'yüz ';
  if (tn) s += TR10[tn] + ' ';
  if (o) s += TR1[o] + ' ';
  return s.trim();
}
function trWords(n) {
  if (n === 0) return 'sıfır';
  const parts = [];
  let i = 0;
  while (n > 0 && i < TRS.length) {
    const c = n % 1000;
    if (c) { let w = trBelow(c); if (i === 1 && c === 1) w = ''; parts.unshift((w + ' ' + TRS[i]).trim()); }
    n = Math.floor(n / 1000); i++;
  }
  return parts.join(' ');
}
const EN1 = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const EN10 = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
const ENS = ['', 'thousand', 'million', 'billion', 'trillion'];
function enBelow(n) {

  if (n >= 20) { s += EN10[Math.floor(n / 10)]; if (n % 10) s += '-' + EN1[n % 10]; } else if (n > 0) s += EN1[n];
  return s;
}
function enWords(n) {
  if (n === 0) return 'zero';
  const parts = [];
  let i = 0;
  while (n > 0 && i < ENS.length) {
    const c = n % 1000;
    if (c) parts.unshift((enBelow(c) + ' ' + ENS[i]).trim());
    n = Math.floor(n / 1000); i++;
  }
  return parts.join(' ');
}
const capWords = (s) => s.split(' ').map((x) => x.charAt(0).toLocaleUpperCase(lang === 'tr' ? 'tr' : 'en') + x.slice(1)).join(' ');
function amountInWords(v, cur) {
  const e = CURWORDS[cur === 'TRL' ? 'TRY' : cur];
  if (!e || v == null || !isFinite(v) || Math.abs(v) >= 1e15) return '';
  const names = lang === 'tr' ? e[0] : e[1];

  if (minor) s += (lang === 'tr' ? ' ' : ' and ') + capWords(w(minor)) + ' ' + names[1];

  list.forEach((x) => {
    if (x && typeof x === 'object') {
      let o = x;
      if (!o.DocDtls && o.SignedInvoice) {

function parseRoot(root, ctx) {
  const find = (names) => { for (const n of names) { if (root.localName === n) return root; const d = desc1(root, n); if (d) return d; } return null; };
  let el;
  if ((el = find(['Invoice', 'CreditNote', 'DebitNote']))) return [ubl(el)];
  if ((el = find(['CrossIndustryInvoice']))) return [cii(el, ctx)];
  if ((el = find(['FatturaElettronica']))) return fattura(el);
  if (root.localName === 'Comprobante') return [cfdi(root)];
  if ((el = find(['infNFe']))) return [nfe(el, root)];
  if (root.localName === 'CrossIndustryDocument') throw new AppErr('zugferd1');
  if (root.localName === 'ApplicationResponse') throw new AppErr('appResponse');
  throw new AppErr('notInvoice', root.localName || '?');
}
function parseText(text, ctx) {
  const s = String(text).replace(/^﻿/, '').trim();
  if (!s) throw new AppErr('badData');
  if (s[0] === '{' || s[0] === '[') return parseJson(s);
  // Invoices never need a DTD. Refusing it blocks entity-expansion attacks.
  if (/<!DOCTYPE|<!ENTITY/i.test(s)) throw new AppErr('unsafeXml');
  return parseRoot(parseXml(s).documentElement, ctx || {});
}

    chunks.push(value);

  chunks.forEach((c) => { out.set(c, o); o += c.length; });
  return out;
}
function readZip(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) { if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; } }
  if (eocd < 0) throw new AppErr('zipFail');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let i = 0; i < count; i++) {
    if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + elen + clen;
    if (name.endsWith('/')) continue;
    const start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
    const data = u8.subarray(start, start + csize);
    out.push({ name, read: async () => (method === 0 ? data : method === 8 ? inflate(data, 'deflate-raw') : Promise.reject(new AppErr('zipFail'))) });
  }
  return out;
}
async function pdfEmbedded(u8) {
  const s = new TextDecoder('latin1').decode(u8);
  const re = /stream\r?\n/g;
  const found = [];
  let m;
  while ((m = re.exec(s))) {
    const idx = m.index;
    if (s.substr(idx - 3, 3) === 'end') continue;
    const dict = s.slice(s.lastIndexOf('obj', idx), idx);
    if (!/EmbeddedFile/.test(dict)) continue;
    const start = idx + m[0].length;
    const end = s.indexOf('endstream', start);
    if (end < 0) continue;
    const lenM = /\/Length\s+(\d+)(?!\d)(?!\s+\d+\s+R)/.exec(dict);
    let data = u8.subarray(start, lenM && start + parseInt(lenM[1], 10) <= end + 2 ? start + parseInt(lenM[1], 10) : end);
    try {
      if (/FlateDecode/.test(dict)) {
        let res = null, fail = null;
        // The stream may be followed by an EOL (0-2 bytes) before "endstream"; zlib rejects trailing bytes.
        for (const cut of [0, 1, 2]) {
          try { res = await inflate(lenM ? data : u8.subarray(start, end - cut), 'deflate'); break; } catch (e) { fail = e; if (e instanceof AppErr || lenM) break; }
        }
        if (!res) throw fail;
        data = res;
      }
      const text = new TextDecoder('utf-8').decode(data);
      if (/<(\w+:)?(CrossIndustryInvoice|Invoice|CreditNote)[\s>]/.test(text.slice(0, 6000))) found.push(text);
    } catch (e) { if (e instanceof AppErr && e.k === 'tooBig') throw e; /* otherwise skip this stream */ }
  }
  return found;
}
function cutFattura(s) {
  const a = s.search(/<\?xml|<(\w+:)?FatturaElettronica[\s>]/);
  const re = /<\/(?:\w+:)?FatturaElettronica>/g;
  let last = -1, m;
  while ((m = re.exec(s))) last = m.index + m[0].length;
  return a >= 0 && last > a ? s.slice(a, last) : null;
}
function xmlFromBinary(u8) {
  const s = new TextDecoder('utf-8').decode(u8);
  const r = cutFattura(s);
  if (r) return r;
  const compact = s.replace(/\s+/g, '');
  if (/^[A-Za-z0-9+/=]{100,}$/.test(compact)) {
    try { return cutFattura(new TextDecoder('utf-8').decode(Uint8Array.from(atob(compact), (c) => c.charCodeAt(0)))); } catch (e) { /* not base64 */ }
  }
  return null;
}
function decodeText(u8) {
  if (u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder('utf-16le').decode(u8);
  if (u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder('utf-16be').decode(u8);
  const head = new TextDecoder('utf-8').decode(u8.subarray(0, 200));
  const m = /encoding=["']([^"']+)["']/i.exec(head);
  try { return new TextDecoder(m ? m[1].toLowerCase() : 'utf-8').decode(u8); } catch (e) { return new TextDecoder('utf-8').decode(u8); }
}

function renderInvoice(inv, opts) {
  opts = opts || {};
  const isTR = inv.format === 'UBL-TR';
  let headline, sub;
  if (isTR) {
    headline = inv.trProfile === 'EARSIVFATURA' ? t('eArchive') : t('eInvoice');
    sub = (inv.typeParts || []).map(pick).concat(inv.copy ? [t('copy')] : []).join(' · ');
  } else {
    headline = pick(KINDS[inv.kind] || KINDS.other);
    sub = inv.typeNote || '';
  }
  const meta = [[t('invoiceNo'), inv.id], [t('date'), fdate(inv.date) + (inv.time ? ' ' + inv.time : '')], [t('due'), fdate(inv.due)]]
    .concat(inv.refs.map((r) => [t(r.k), refText(r)])).concat([[t('currency'), inv.cur]]).filter((r) => r[1] && String(r[1]).trim());
  const metaHtml = meta.map((r) => '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>').join('');

  const cols = { disc: inv.lines.some((l) => l.discount || l.discountPct != null || l.charge), tax: inv.lines.some((l) => l.taxes.length) };
  cols.taxHead = inv.lines.every((l) => l.taxes.every((x) => x.kind === 'vat')) ? t('vat') : t('taxCol');
  const table = inv.lines.length
    ? '<div class="tablewrap"><table class="items"><thead><tr><th class="num">' + esc(t('no')) + '</th><th>' + esc(t('item')) + '</th><th class="num">' + esc(t('qty')) + '</th><th class="num">' + esc(t('price')) + '</th>'
      + (cols.disc ? '<th class="num">' + esc(t('disc')) + '</th>' : '') + (cols.tax ? '<th class="num">' + esc(cols.taxHead) + '</th>' : '') + '<th class="num">' + esc(t('amount')) + '</th></tr></thead><tbody>'
      + inv.lines.map((l, i) => lineRow(l, i, cols)).join('') + '</tbody></table></div>'

  const left = [];
  if (inv.notes.length) left.push('<div><div class="eyebrow">' + esc(t('notes')) + '</div><ul>' + inv.notes.map((n) => '<li>' + esc(n) + '</li>').join('') + '</ul></div>');
  const pay = inv.payments.map((p) => {
    const head = [pick(p.means), p.due ? t('dueShort') + ': ' + fdate(p.due) : '', p.amount != null ? money(p.amount) + ' ' + curLabel(inv.cur) : ''].filter(Boolean).join(' · ');
    return '<li>' + esc(head) + (p.ref ? '<div class="cap">' + esc(p.ref) + '</div>' : '') + (p.iban ? '<div class="mono">' + esc(fmtIban(p.iban)) + '</div>' : '') + (p.bank ? '<div class="cap">' + esc(p.bank) + '</div>' : '') + '</li>';
  }).concat(inv.terms.map((x) => '<li>' + esc(x) + '</li>'));
  if (pay.length) left.push('<div><div class="eyebrow">' + esc(t('payment')) + '</div><ul>' + pay.join('') + '</ul></div>');
  if (inv.exemptions.length) left.push('<div><div class="eyebrow">' + esc(t('exempt')) + '</div><ul>' + inv.exemptions.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>');

  const words = isTR ? amountInWords(inv.totals.payable, inv.cur) : '';
  const fine = [];
  if (opts.fileName) fine.push('<span>' + esc(t('file')) + ': ' + esc(opts.fileName) + '</span>');
  fine.push('<span>' + esc(t('formatLbl')) + ': ' + esc(inv.format) + '</span>');
  if (inv.signed !== null) fine.push('<span>' + esc(t(inv.signed ? 'sigYes' : 'sigNo')) + '</span>');

  return '<div class="head"><div><div class="eyebrow">' + esc(t('seller')) + '</div>' + partyHtml(inv.seller, false) + '</div>'
    + '<div class="docbox"><span class="fmt">' + esc(inv.format) + '</span><div class="label">' + esc(headline) + '</div><div class="kind">' + esc(sub) + '</div>'
    + '<dl class="meta">' + metaHtml + '</dl></div></div>'
    + (inv.buyer ? '<div class="buyer"><div class="eyebrow">' + esc(isTR ? t('buyerTR') : t('buyer')) + '</div>' + partyHtml(inv.buyer, true) + '</div>' : '')
    + table
    + '<div class="foot"><div class="foot-left">' + left.join('') + '</div><div>' + totalsHtml(inv) + '</div></div>'
    + (words ? '<div class="words"><strong>' + esc(t('words')) + '</strong> ' + esc(words) + '</div>' : '')
    + '<div class="fine">' + fine.join('') + '</div>';
}

function summaryText(inv) {

async function copyText(text, msg) {

const mkItem = (name, inv) => ({ id: ++seq, name, inv });
const errItem = (name, e) => ({ id: ++seq, name, err: e instanceof AppErr ? { k: e.k, a: e.a } : { k: 'readFail', a: [] } });

async function ingest(name, u8, out, depth) {
  const isPdf = u8.length > 4 && u8[0] === 0x25 && u8[1] === 0x50 && u8[2] === 0x44 && u8[3] === 0x46;
  const isZip = u8.length > 4 && u8[0] === 0x50 && u8[1] === 0x4b && u8[2] === 3 && u8[3] === 4;
  try {
    if (isZip) {
      if (depth > 1) throw new AppErr('zipFail');
      const entries = readZip(u8).filter((e) => /\.(xml|json|pdf|p7m|zip)$/i.test(e.name) && !/__MACOSX|(^|\/)\./.test(e.name)).slice(0, 300);
      if (!entries.length) throw new AppErr('zipEmpty');
      for (const e of entries) {
        let bytes;
        try { bytes = await e.read(); } catch (err) { out.push(errItem(e.name.split('/').pop(), err)); continue; }
        await ingest(e.name.split('/').pop(), bytes, out, depth + 1);
      }
      return;
    }
    if (isPdf) {
      const xmls = await pdfEmbedded(u8);
      let got = 0, lastErr = null;
      for (const x of xmls) {
        try { parseText(x, { fromPdf: true }).forEach((inv) => { out.push(mkItem(name, inv)); got++; }); } catch (e) { lastErr = e; }
      }
      if (!got) throw lastErr || new AppErr('pdfNoXml');
      return;
    }
    let text = decodeText(u8);
    let viaBinary = false;
    if (!/^\s*[<{[]/.test(text.replace(/^﻿/, ''))) {
      const x = xmlFromBinary(u8);
      if (!x) throw new AppErr('badData');
      text = x; viaBinary = true;
    }
    const invs = parseText(text, {});
    invs.forEach((inv) => { if (viaBinary) inv.signed = true; out.push(mkItem(name, inv)); });
  } catch (e) { out.push(errItem(name, e)); }
}

async function addItems(fn) {
  const out = [];
  inflateBudget = INFLATE_TOTAL;
  await fn(out);
  if (!out.length) return;
  const firstNew = items.length;
  items.push(...out);
  const ok = items.findIndex((it, i) => i >= firstNew && it.inv);
  current = ok >= 0 ? ok : firstNew;
  render();
}
async function handleFiles(list) {
  const files = Array.from(list || []);
  if (!files.length) return;
  await addItems(async (out) => {
    for (const f of files) {
      try {
        if (f.size > 80 * 1024 * 1024) throw new AppErr('tooBig');
        await ingest(f.name, new Uint8Array(await f.arrayBuffer()), out, 0);
      } catch (e) { out.push(errItem(f.name, e)); }
    }
  });
}
async function handlePaste(text) {
  const s = text.trim();
  await addItems((out) => ingest(s[0] === '<' ? 'pasted.xml' : 'pasted.json', new TextEncoder().encode(s), out, 0));
}

function render() {
  const chips = $('chips');
  chips.textContent = '';
  if (items.length) {
    items.forEach((it, idx) => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (it.err ? ' bad' : '');
      if (idx === current) chip.setAttribute('aria-current', 'true');
      const sel = document.createElement('button');
      sel.type = 'button'; sel.className = 'sel';
      sel.textContent = it.inv && it.inv.id ? it.name + ' · ' + it.inv.id : it.name;
      sel.title = it.name;
      sel.addEventListener('click', () => { current = idx; render(); });
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'x'; x.textContent = '×'; x.setAttribute('aria-label', t('remove', it.name));
      x.addEventListener('click', () => {
        items.splice(idx, 1);
        current = items.length ? Math.min(idx < current ? current - 1 : current, items.length - 1) : -1;
        render();
      });
      chip.appendChild(sel); chip.appendChild(x); chips.appendChild(chip);
    });
  }
  const it = items[current];
  const notices = $('notices');
  notices.textContent = '';
  const addNotice = (cls, text) => { const d = document.createElement('div'); d.className = 'notice ' + cls; d.textContent = text; notices.appendChild(d); };
  if (it && it.err) addNotice('err', it.name + ': ' + t(it.err.k, ...it.err.a));
  const sheet = $('sheet');
  if (it && it.inv) {
    sheet.innerHTML = renderInvoice(it.inv, { fileName: it.name });
    $('actions').hidden = false;
  } else {
    sheet.innerHTML = '';
    $('actions').hidden = true;
  }
}

}

  if (txt && /^\s*[<{[]/.test(txt)) { e.preventDefault(); handlePaste(txt); }
});
$('copySummary').addEventListener('click', () => { const it = items[current]; if (it && it.inv) copyText(summaryText(it.inv), t('copiedSummary')); });
$('copyLines').addEventListener('click', () => { const it = items[current]; if (it && it.inv) copyText(lineTSV(it.inv), t('copiedLines')); });
document.querySelectorAll('#langSeg button').forEach((b) => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('themeBtn').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  store.set('fo-theme', next);
  applyStatic();
});

(function init() {
  const sl = store.get('fo-lang');
  lang = sl === 'tr' || sl === 'en' ? sl : /^tr/i.test(navigator.language || '') ? 'tr' : 'en';
  const th = store.get('fo-theme');
  if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  applyStatic();
  render();
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyStatic); } catch (e) { /* older browsers */ }
})();
</script>
